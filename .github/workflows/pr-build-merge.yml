name: PR build and merge

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.detect.outputs.packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Detect affected packages
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mapfile -t files < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          python scripts/detect_changed_packages.py --files "${files[@]}"

  repository:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Validate repository structure
        run: python scripts/check_repository.py

  packages:
    needs: [changes, repository]
    if: needs.changes.outputs.packages != '[]'
    strategy:
      fail-fast: false
      matrix:
        # Each entry is {name}, derived by detect_changed_packages.py so new
        # modules need no workflow change.
        module: ${{ fromJSON(needs.changes.outputs.packages) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build dev image
        run: make build

      - name: Run checks and tests for the package
        run: make check-all pkg=${{ matrix.module.name }}

      - name: Stop containers
        if: always()
        run: make down

  sonar:
    needs: [repository]
    runs-on: ubuntu-latest
    env:
      # Single SonarCloud project for the whole repository. Configure the
      # SONAR_TOKEN secret to enable the scan; until then it is skipped.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run SonarQube scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Single stable check to require in branch protection. The packages job is a
  # matrix, so its check names vary by changed module and cannot be required by
  # name; this gate aggregates every job instead.
  build-gate:
    if: always()
    needs: [changes, repository, packages, sonar]
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs to pass (skipped is allowed)
        run: |
          for result in \
            "${{ needs.changes.result }}" \
            "${{ needs.repository.result }}" \
            "${{ needs.packages.result }}" \
            "${{ needs.sonar.result }}"; do
            case "${result}" in
              success|skipped) ;;
              *) echo "A required job did not pass: ${result}"; exit 1 ;;
            esac
          done
          echo "All required jobs passed."

  notify-teams:
    needs: [build-gate]
    if: ${{ github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compute added/removed lines for notification
        id: diff
        run: |
          PR_DATA=$(gh pr view "${{ github.event.pull_request.number }}" --json additions,deletions -q '.')
          ADDITIONS=$(echo "$PR_DATA" | jq '.additions')
          DELETIONS=$(echo "$PR_DATA" | jq '.deletions')
          echo "additions=$ADDITIONS" >> $GITHUB_OUTPUT
          echo "deletions=$DELETIONS" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Microsoft Teams
        uses: softwareone-platform/notify-pr-teams-action@v4
        with:
          webhook_url: ${{ secrets.TEAMS_WEBHOOK_URL }}
          bot_image_url: https://raw.githubusercontent.com/softwareone-platform/mpt-extension-python-contrib/main/.github/workflows/assets/turing_team_pr_bot.png
          repo: ${{ github.repository }}
          pr_url: ${{ github.event.pull_request.html_url }}
          pr_title: ${{ github.event.pull_request.title }}
          pr_author: ${{ github.event.pull_request.user.login }}
          head_ref: ${{ github.event.pull_request.head.ref }}
          base_ref: ${{ github.event.pull_request.base.ref }}
          commits: ${{ github.event.pull_request.commits }}
          changed_files: ${{ github.event.pull_request.changed_files }}
          additions: ${{ steps.diff.outputs.additions }}
          deletions: ${{ steps.diff.outputs.deletions }}
          pr_number: ${{ github.event.pull_request.number }}
          pr_status: ${{ github.event.pull_request.state }}
          is_merged: ${{ github.event.pull_request.merged }}
